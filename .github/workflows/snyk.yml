name: Snyk Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run every Monday at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  snyk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run the locked Snyk CLI and create SARIF
        continue-on-error: true # Vulnerability findings remain advisory in this integration.
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG: ${{ vars.SNYK_ORG }}
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          args=(test --severity-threshold=high --sarif-file-output=snyk.sarif)
          if [ -n "$SNYK_ORG" ]; then args+=(--org="$SNYK_ORG"); fi
          npx --no-install snyk "${args[@]}"

      - name: Require a scan report
        if: always()
        run: |
          if [ ! -s snyk.sarif ]; then
            echo "::error::Snyk did not produce a report. Check installation, SNYK_TOKEN and organization access; this is not a completed scan."
            exit 1
          fi

      - name: Upload Snyk SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('snyk.sarif') != ''
        with:
          sarif_file: snyk.sarif
